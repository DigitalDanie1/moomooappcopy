<title>Moomooapp</title>
<style>
* {
  box-sizing: border-box;
}
html,
body {
  position: fixed;
  inset: 0;
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #fff;
  color: #111827;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  overscroll-behavior: none;
  overscroll-behavior-y: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
html {
  background: #fff;
}
body {
  min-height: var(--app-height, 100vh);
  padding: 0;
  touch-action: manipulation;
}
.app-shell {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: var(--app-height, 100vh);
  overflow: hidden;
  background: #fff;
  opacity: 1;
  transition: opacity .12s ease;
}
body.native-system-bars .app-shell {
  background: #fff;
}
body.app-sizing-pending .app-shell {
  opacity: 0;
}
.intro-screen,
.image-screen {
  position: absolute;
  inset: 0;
  display: grid;
  width: 100%;
  height: var(--app-height, 100vh);
  overflow: hidden;
  background: #fff;
  transition: opacity .14s ease;
}
.intro-screen {
  appearance: none;
  -webkit-appearance: none;
  place-items: start center;
  padding: 0;
  border: 0;
  outline: 0;
  background: #111315;
  color: inherit;
  font: inherit;
  cursor: pointer;
  z-index: 2;
}
.image-screen {
  place-items: start center;
  z-index: 1;
  opacity: 0;
  pointer-events: none;
}
.screen-image {
  position: absolute;
  left: var(--frame-left, 0px);
  top: var(--frame-top, 0px);
  display: block;
  width: var(--frame-width, 100vw);
  height: var(--frame-height, var(--app-height, 100vh));
  object-fit: fill;
  object-position: top center;
  background: #fff;
  -webkit-user-drag: none;
}
.hotspot-layer {
  position: absolute;
  left: var(--frame-left, 0px);
  top: var(--frame-top, 0px);
  width: var(--frame-width, 100vw);
  height: var(--frame-height, var(--app-height, 100vh));
  z-index: 4;
  pointer-events: none;
}
.tap-zone {
  appearance: none;
  -webkit-appearance: none;
  position: absolute;
  display: block;
  border: 0;
  border-radius: 18px;
  padding: 0;
  background: transparent;
  color: transparent;
  outline: none;
  pointer-events: auto;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.tap-zone:focus,
.tap-zone:focus-visible {
  outline: none;
  box-shadow: none;
}
.tap-zone[data-back] {
  pointer-events: none;
}
body[data-active-screen="search"] .tap-zone[data-back] {
  pointer-events: auto;
}
.native-mask {
  position: absolute;
  left: var(--frame-left, 0px);
  width: var(--frame-width, 100vw);
  z-index: 5;
  display: none;
  pointer-events: none;
}
.native-mask.top {
  display: block;
}
body.native-system-bars .native-mask.bottom {
  display: block;
}
.native-mask.top {
  top: var(--frame-top, 0px);
  height: calc(var(--frame-height, 1280px) * .066);
  background: #fff;
}
.native-mask.bottom {
  top: calc(var(--frame-top, 0px) + var(--frame-height, 1280px) * .985);
  height: calc(var(--frame-height, 1280px) * .015);
  background: #fff;
}
.intro-screen .native-mask.top,
.intro-screen .native-mask.bottom {
  background: #111315;
}
.app-loader {
  position: absolute;
  inset: 0;
  z-index: 9;
  display: grid;
  place-items: center;
  background: rgba(255, 255, 255, .48);
  opacity: 0;
  pointer-events: none;
  transition: opacity .14s ease;
}
body.launching .app-loader,
body.screen-switching .app-loader {
  opacity: 1;
}
.loader-dot {
  width: 34px;
  height: 34px;
  border: 3px solid rgba(255, 105, 20, .22);
  border-top-color: #ff6a13;
  border-radius: 50%;
  animation: spin .62s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
.sheet-backdrop {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 0 12px max(10px, env(safe-area-inset-bottom));
  background: rgba(0, 0, 0, .18);
  opacity: 0;
  pointer-events: none;
  transition: opacity .16s ease;
}
.sheet-backdrop.is-open {
  opacity: 1;
  pointer-events: auto;
}
.action-sheet {
  width: min(564px, calc(100vw - 24px));
  border-radius: 18px;
  background: #fff;
  box-shadow: 0 -18px 46px rgba(15, 23, 42, .18);
  color: #111;
  transform: translateY(18px);
  transition: transform .16s ease;
  overflow: hidden;
}
.sheet-backdrop.is-open .action-sheet {
  transform: translateY(0);
}
.sheet-grabber {
  width: 42px;
  height: 5px;
  margin: 10px auto 8px;
  border-radius: 999px;
  background: #d8dce2;
}
.sheet-body {
  padding: 6px 20px 18px;
}
.sheet-title {
  margin: 0 0 8px;
  font-size: 19px;
  line-height: 1.2;
  font-weight: 800;
}
.sheet-copy {
  margin: 0 0 14px;
  color: #5f6672;
  font-size: 14px;
  line-height: 1.45;
}
.sheet-actions {
  display: grid;
  gap: 8px;
}
.sheet-action {
  width: 100%;
  min-height: 44px;
  border-radius: 12px;
  background: #f3f5f8;
  color: #17191d;
  font-size: 15px;
  font-weight: 700;
}
.sheet-action.primary {
  background: #ff6a13;
  color: #fff;
}
.balance-patches {
  position: absolute;
  left: var(--frame-left, 0px);
  top: var(--frame-top, 0px);
  width: var(--frame-width, 100vw);
  height: var(--frame-height, var(--app-height, 100vh));
  z-index: 3;
  pointer-events: none;
}
.balance-patch {
  position: absolute;
  display: none;
  overflow: hidden;
  background: #fff;
  color: #08090b;
  font-family: "MiSans", "MiSans Simple", -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  letter-spacing: -.055em;
  white-space: nowrap;
}
.balance-patch::after {
  content: "38,000";
  position: absolute;
  left: 0;
  top: 0;
}
.demo-badge {
  position: fixed;
  top: var(--demo-top, 54px);

  z-index: 20;
  padding: 4px 8px;
  border: 1px solid rgba(255, 106, 19, .65);
  border-radius: 5px;
  background: rgba(255, 255, 255, .92);
  color: #ff6a13;
  font: 700 11px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  letter-spacing: .06em;
  pointer-events: none;
}

  top: 27.62%;

  font-weight: 450;
}
body[data-active-screen="watchlists"] .watchlist-assets {
  display: block;
}
body[data-active-screen="accounts"] .account-assets {
  display: block;
}
.watchlist-assets {
  left: 3.1%;
  top: 28.85%;
  width: 31.4%;
  height: 4.0%;
  font-size: calc(var(--frame-width, 588px) * .0625);
  line-height: .98;
  font-weight: 450;
}
.account-assets {

  background: #f7f8fa;
}
.account-assets.hero {
  top: 19.22%;

}
.account-assets.card-one {

  font-weight: 440;
}
.account-assets.card-two {

  font-size: calc(var(--frame-width, 588px) * .0645);
  line-height: .98;
  font-weight: 440;
}
.fallback {
  display: none;
  width: min(340px, calc(100vw - 36px));
  margin-top: 22vh;
  padding: 18px;
  border: 1px solid #d9e1ec;
  border-radius: 14px;
  background: #f8fafc;
  box-shadow: 0 18px 50px rgba(15, 23, 42, .12);
  text-align: center;
}
.fallback strong {
  display: block;
  margin-bottom: 8px;
  font-size: 18px;
}
.fallback p {
  margin: 0;
  color: #667085;
  font-size: 14px;
  line-height: 1.5;
}
body.image-error .screen-image {
  display: none;
}
body.image-error .fallback {
  display: block;
}
body.show-image .intro-screen {
  opacity: 0;
  pointer-events: none;
}
body.show-image .image-screen {
  opacity: 1;
  pointer-events: auto;
}
@media (display-mode: standalone) {
  html,
  body,
  .app-shell {
    background: #fff;
  }
}
@supports (height: 100dvh) {
  body,
  .app-shell,
  .intro-screen,
  .image-screen {
    height: var(--app-height, 100dvh);
  }
}
</style>

<script>
const images = Array.from(document.querySelectorAll(".screen-image"));
const intro = document.querySelector(".intro-screen");
const appImage = document.querySelector("[data-app-image]");
const tapZones = Array.from(document.querySelectorAll(".tap-zone"));
const sheet = document.querySelector("[data-sheet]");
const sheetTitle = document.querySelector(".sheet-title");
const sheetCopy = document.querySelector("[data-sheet-copy]");

function screenAsset(src) {
  const versionedSrc = `${src}?v=20`;
  const versioned2x = `${src.replace(/\.png$/, "@2x.png")}?v=20`;
  return {
    src: versionedSrc,
    srcset: `${versionedSrc} 1x, ${versioned2x} 2x`
  };
}

const splashAsset = screenAsset("./splash-screen.png");
const screens = {
  accounts: screenAsset("./screens/accounts.png"),
  watchlists: screenAsset("./screens/watchlists.png"),
  markets: screenAsset("./screens/markets.png"),
  wealth: screenAsset("./screens/wealth.png"),
  discover: screenAsset("./screens/discover.png"),
  trade: screenAsset("./screens/trade.png")
};
const requestedScreen = location.hash.replace("#", "");
let activeScreen = screens[requestedScreen] ? requestedScreen : "watchlists";
let previousScreen = activeScreen;
let lastViewportSignature = "";
let stableViewportFrames = 0;
let launchTimer = 0;
let splashTimer = 0;
document.body.dataset.activeScreen = activeScreen;

function setAppHeight() {
  const viewport = window.visualViewport;
  const widthCandidates = [
    window.innerWidth,
    document.documentElement.clientWidth,
    viewport?.width
  ].filter((value) => Number.isFinite(value) && value > 0);
  const candidates = [
    window.innerHeight,
    document.documentElement.clientHeight,
    viewport?.height
  ].filter((value) => Number.isFinite(value) && value > 0);
  const width = Math.ceil(Math.max(...widthCandidates));
  const height = Math.ceil(Math.max(...candidates));
  const designWidth = 588;
  const designHeight = 1280;
  const designRatio = designWidth / designHeight;
  const topOffset = Math.min(width / designWidth, height / designHeight) * 24;
  const availableHeight = height - topOffset;
  const viewportRatio = width / availableHeight;
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const snap = (value) => Math.round(value * dpr) / dpr;
  let frameWidth;
  let frameHeight;

  if (viewportRatio > designRatio) {
    frameHeight = availableHeight;
    frameWidth = availableHeight * designRatio;
  } else {
    frameWidth = width;
    frameHeight = width / designRatio;
  }

  frameWidth = Math.min(width, snap(frameWidth));
  frameHeight = Math.min(availableHeight, snap(frameHeight));
  const frameTop = snap(topOffset + (availableHeight - frameHeight) / 2);

  document.documentElement.style.setProperty("--app-height", `${height}px`);
  document.documentElement.style.setProperty("--frame-width", `${frameWidth}px`);
  document.documentElement.style.setProperty("--frame-height", `${frameHeight}px`);
  document.documentElement.style.setProperty("--frame-left", `${snap((width - frameWidth) / 2)}px`);
  document.documentElement.style.setProperty("--frame-top", `${frameTop}px`);
  document.documentElement.style.setProperty("--demo-top", `${snap(frameTop + frameHeight * .042)}px`);
  return height;
}

function viewportSignature() {
  const viewport = window.visualViewport;
  return [
    Math.round(window.innerWidth || 0),
    Math.round(window.innerHeight || 0),
    Math.round(document.documentElement.clientWidth || 0),
    Math.round(document.documentElement.clientHeight || 0),
    Math.round(viewport?.width || 0),
    Math.round(viewport?.height || 0)
  ].join("x");
}

function preloadImage(src) {
  return new Promise((resolve, reject) => {
    const preload = new Image();
    preload.onload = resolve;
    preload.onerror = reject;
    preload.src = src;
  });
}

function revealAfterStableViewport() {
  setAppHeight();
  const signature = viewportSignature();
  stableViewportFrames = signature === lastViewportSignature ? stableViewportFrames + 1 : 0;
  lastViewportSignature = signature;

  if (stableViewportFrames >= 2) {
    document.body.classList.remove("app-sizing-pending");
    return;
  }
  requestAnimationFrame(revealAfterStableViewport);
}

function scheduleFit() {
  stableViewportFrames = 0;
  requestAnimationFrame(revealAfterStableViewport);
}

setAppHeight();
scheduleFit();
setTimeout(() => {
  setAppHeight();
  document.body.classList.remove("app-sizing-pending");
}, 700);
window.addEventListener("resize", scheduleFit, { passive: true });
window.visualViewport?.addEventListener("resize", scheduleFit, { passive: true });
window.addEventListener("orientationchange", () => {
  setTimeout(scheduleFit, 250);
}, { passive: true });
window.addEventListener("pageshow", scheduleFit, { passive: true });

Promise.allSettled([
  preloadImage(splashAsset.src),
  preloadImage(splashAsset.src.replace(/\.png$/, "@2x.png")),
  ...Object.values(screens).flatMap((asset) => [
    preloadImage(asset.src),
    preloadImage(asset.src.replace(/\.png$/, "@2x.png"))
  ])
]).finally(() => {
  scheduleFit();
});

function openImageScreen() {
  setAppHeight();
  document.body.classList.add("show-image");
}

function showIntroScreen() {
  document.body.classList.remove("show-image");
}

function showLaunchThenOpen() {
  window.clearTimeout(launchTimer);
  window.clearTimeout(splashTimer);
  setAppHeight();
  document.body.classList.add("launching");
  launchTimer = window.setTimeout(() => {
    document.body.classList.remove("launching");
    openImageScreen();
  }, 520);
}

function setScreen(name, options = {}) {
  const asset = screens[name];
  if (!asset || !appImage) return;
  if (name !== activeScreen) previousScreen = activeScreen;
  activeScreen = name;
  document.body.dataset.activeScreen = name;
  document.body.classList.add("screen-switching");
  appImage.srcset = asset.srcset;
  appImage.src = asset.src;
  appImage.alt = `${name} app screen`;
  if (options.open !== false) openImageScreen();
  window.setTimeout(() => document.body.classList.remove("screen-switching"), 150);
  if (options.push !== false && location.hash !== `#${name}`) {
    history.pushState({ screen: name }, "", `#${name}`);
  }
}

function showTapFeedback(event, label) {
  window.__lastPrototypeTap = label;
}

function openSheet(title, copy) {
  if (!sheet) return;
  sheetTitle.textContent = title;
  sheetCopy.textContent = copy;
  sheet.classList.add("is-open");
  sheet.setAttribute("aria-hidden", "false");
}

function closeSheet() {
  sheet?.classList.remove("is-open");
  sheet?.setAttribute("aria-hidden", "true");
}

function runAction(label) {
  const actions = {
    Inbox: ["Inbox", "알림과 메시지 목록이 열리는 것처럼 동작합니다."],
    "Total Assets": ["Total Assets", "총 자산 상세 화면으로 들어가는 자리입니다."],
    Deposit: ["Deposit", "입금 화면으로 이어지는 프로토타입 액션입니다."],
    Exchange: ["Exchange", "환전 화면으로 이어지는 프로토타입 액션입니다."],
    RSP: ["RSP", "RSP 설정 화면으로 이어지는 프로토타입 액션입니다."],
    All: ["All Services", "전체 서비스 목록을 여는 자리입니다."],
    "All Accounts": ["All Accounts", "계좌 목록 접기/펼치기 액션처럼 반응합니다."],
    "Margin Account": ["Margin Account", "Margin Account 상세 화면으로 들어가는 자리입니다."],
    "Cash Account": ["Cash Account", "Cash Account 상세 화면으로 들어가는 자리입니다."],
    "Edit Accounts": ["Edit Accounts", "계좌 편집 화면으로 이어지는 프로토타입 액션입니다."]
  };
  const [title, copy] = actions[label] || [label, "선택한 영역이 눌렸습니다."];
  openSheet(title, copy);
}

function finishSplash() {
  window.clearTimeout(splashTimer);
  window.clearTimeout(launchTimer);
  document.body.classList.remove("launching");
  setScreen(activeScreen, { push: false });
}

intro.addEventListener("click", () => finishSplash());
intro.addEventListener("touchend", (event) => {
  event.preventDefault();
  finishSplash();
}, { passive: false });

tapZones.forEach((zone) => {
  zone.addEventListener("click", (event) => {
    event.preventDefault();
    event.stopPropagation();
    showTapFeedback(event, zone.dataset.tap || zone.getAttribute("aria-label") || "button");
    if (zone.dataset.back) {
      if (activeScreen === "search") setScreen(previousScreen || "accounts");
      return;
    }
    if (zone.dataset.screen) {
      setScreen(zone.dataset.screen);
      return;
    }
    runAction(zone.dataset.tap || zone.getAttribute("aria-label") || "Action");
  });
});

window.addEventListener("popstate", () => {
  const screenName = location.hash.replace("#", "");
  if (screens[screenName]) {
    setScreen(screenName, { push: false });
    return;
  }
  closeSheet();
  document.body.classList.remove("show-image");
});

window.addEventListener("keydown", (event) => {
  if ((event.key === "Enter" || event.key === " ") && !document.body.classList.contains("show-image")) {
    event.preventDefault();
    openImageScreen();
  }
});

images.forEach((image) => {
  image.addEventListener("error", () => {
    if (image.dataset.retriedPlainSrc === "1") {
      document.body.classList.add("image-error");
      return;
    }
    image.dataset.retriedPlainSrc = "1";
    image.removeAttribute("srcset");
    const fallbackSrc = image.currentSrc || image.getAttribute("src") || "";
    image.src = fallbackSrc.replace(/@2x(?=\.png(?:$|\?))/, "");
  });
});

document.addEventListener("contextmenu", (event) => {
  event.preventDefault();
});

sheet?.addEventListener("click", (event) => {
  if (event.target === sheet || event.target.closest("[data-sheet-close]")) closeSheet();
});

window.addEventListener("keydown", (event) => {
  if (event.key === "Escape") closeSheet();
});

if (appImage) {
  appImage.srcset = screens[activeScreen].srcset;
  appImage.src = screens[activeScreen].src;
  appImage.alt = `${activeScreen} app screen`;
}

if (new URLSearchParams(location.search).has("native-bars")) {
  document.body.classList.add("native-system-bars");
}

splashTimer = window.setTimeout(finishSplash, 1150);

if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(() => {});
  });
}
</script>
</body>
</html>
